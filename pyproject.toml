[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sotascope"
version = "0.5.0"
description = "Local-first research literature dashboard"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "bibtexparser>=1.4",
    "python-multipart>=0.0.7",
    "pdfplumber>=0.10",
    "anthropic>=0.40",
    "openai>=1.0",
    "grobid-tei-xml>=0.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
fixtures = [
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]

[project.scripts]
sotascope = "sotascope.cli:main"

[tool.setuptools.packages.find]
include = ["sotascope*"]

[tool.ruff]
target-version = "py311"
line-length = 99
